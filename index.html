<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakka Yasa Pubbakari | Linktree</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      padding: 40px 30px;
      border-radius: 25px;
      width: 350px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      color: white;
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 4px solid white;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    p {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    .link {
      display: block;
      text-decoration: none;
      background: white;
      color: #333;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-weight: 500;
      transition: 0.3s ease;
    }

    .link:hover {
      background: #f1f1f1;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.7;
    }

  </style>
</head>
<body>

  <div class="container">
    <img src="img/p.jpg" alt="Profile" class="profile-img">
    
    <h1>Sakka Yasa Pubbakari</h1>
    <p>Digital Creator | Web Developer | Entrepreneur</p>

    <a href="https://github.com/Sakkaxtjkt3" class="link">🌐Github</a>
    <a href="https://instagram.com/terserahboleh" class="link">📸 Instagram</a>
    <a href="https://YouTube.com/@justatrash2661" class="link">🎥 YouTube</a>
    <a href="https://shopee.com/@justatrash2661" class="link">🛒 Toko Online</a>

    <div class="footer">
      © 2026 Sakka Yasa Pubbakari
    </div>
  </div>

</body>
</html>
